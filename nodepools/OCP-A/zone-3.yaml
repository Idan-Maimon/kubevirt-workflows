apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  labels:
    cluster: ocp-a
    zone: zone-3
  name: ocp-a-zone-3
  namespace: clusters
spec:
  clusterName: ocp-a
  management:
    autoRepair: false
    upgradeType: Replace
  platform:
    agent:
      agentLabelSelector:
        matchLabels:
          zone: zone-3
    type: Agent
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.14.13-x86_64
  replicas: 4
