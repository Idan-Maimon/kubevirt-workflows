apiVersion: v1
kind: Secret
metadata:
  name: workflow-credentials
  namespace: hypershift-workflows
type: Opaque
stringData:
  GIT_TOKEN: "<github-personal-access-token>"
  GIT_REPO_URL: "https://github.com/<org>/<repo>.git"
  GIT_BRANCH: "main"
  ARGOCD_URL: "https://<argocd-server-route>"
  ARGOCD_TOKEN: "<argocd-api-token>"
  # Obtain ArgoCD token:
  # curl -k $ARGOCD_URL/api/v1/session \
  #   -H "Content-Type: application/json" \
  #   -d '{"username":"admin","password":"<password>"}' | jq -r .token
  # Note: JWT tokens expire in ~24h. Use a service account token for production.
